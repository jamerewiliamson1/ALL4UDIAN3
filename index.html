<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALL4UDiane♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --pink:#f7c4d5;
  --baby:#fff0f6;
  --blush:#ffe0eb;
  --rose:#e78eaa;
  --deep:#a24d6c;
  --wine:#743a52;
  --ink:#4f3942;
  --muted:#806873;
  --white:#fffdfd;
  --line:#f1cad8;
  --shadow:0 24px 70px rgba(116,58,82,.14);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--ink);font-family:"DM Sans",sans-serif;
  background:
    radial-gradient(circle at 8% 0,#fff 0 12%,transparent 32%),
    radial-gradient(circle at 100% 15%,#ffddea 0 10%,transparent 31%),
    linear-gradient(135deg,#fffafd,#fff1f6 54%,#fffaf8);
  overflow-x:hidden;
}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
a{color:inherit}

#floating{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.float{position:absolute;bottom:-35px;opacity:.48;animation:floatUp linear forwards}
@keyframes floatUp{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes sparkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes shimmer{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}

.corner-kitty{
  position:fixed;z-index:4;pointer-events:none;font-size:30px;opacity:.55;
  animation:bob 4s ease-in-out infinite
}
.ck1{left:16px;top:115px}.ck2{right:18px;top:210px;animation-delay:1s}
.ck3{left:18px;bottom:120px;animation-delay:2s}.ck4{right:20px;bottom:70px;animation-delay:.5s}

.section{max-width:1160px;margin:auto;padding:92px 22px;position:relative;z-index:3}
.heading{text-align:center;margin-bottom:44px}
.eyebrow{text-transform:uppercase;letter-spacing:3px;color:var(--deep);font-size:11px;font-weight:800}
.heading h2{font:600 clamp(40px,6vw,65px)/1.02 "Playfair Display",serif;color:var(--wine);margin:10px 0 13px}
.heading p{max-width:720px;margin:auto;color:var(--muted);line-height:1.8}
.hand{font:600 27px Caveat,cursive;color:var(--deep)}

/* PASSWORD */
#gate{
  position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:18px;
  background:
    radial-gradient(circle at 50% 0,rgba(255,255,255,.5),transparent 30%),
    linear-gradient(135deg,#eeb1c7,#ffdce8 50%,#f8c4d6);
}
.gate-card{
  width:min(470px,100%);background:rgba(255,253,253,.96);border:2px solid #fff;
  border-radius:38px;padding:25px 28px 34px;text-align:center;
  box-shadow:0 35px 100px rgba(94,43,63,.25);position:relative;overflow:hidden
}
.gate-card:before{
  content:"";position:absolute;left:-25%;top:0;width:150%;height:10px;
  background:linear-gradient(90deg,transparent,#fff,#f4a9c1,#fff,transparent);
}
.gate-photo{
  width:220px;height:220px;object-fit:cover;border-radius:50%;
  border:8px solid #fff;box-shadow:0 15px 38px rgba(110,52,75,.2);
  margin:5px auto 17px;display:block
}
.bow-row{font-size:30px;letter-spacing:7px;color:var(--rose);margin-bottom:4px}
.gate-card h1{font:600 42px "Playfair Display",serif;color:var(--wine);margin:0}
.gate-card .sub{font:600 25px Caveat,cursive;color:var(--deep);margin:4px 0 12px}
.gate-card p{color:var(--muted);line-height:1.7;margin:8px 0 17px}
.code{
  width:100%;padding:15px;border:2px solid #f0c4d3;border-radius:17px;
  background:#fff9fb;text-align:center;font-size:23px;letter-spacing:9px;outline:none
}
.code:focus{box-shadow:0 0 0 5px rgba(231,142,170,.16)}
.main-btn{
  border:0;border-radius:999px;padding:14px 25px;margin-top:12px;
  background:var(--deep);color:white;font-weight:800;box-shadow:0 10px 25px rgba(162,77,108,.22);
  transition:.2s
}
.main-btn:hover{transform:translateY(-2px)}
#error{height:18px;margin-top:7px;color:#b04d6b;font-size:13px}

/* OPENING */
#opening{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#fff8fb,#ffdce8)}
.open-card{
  width:min(980px,100%);background:rgba(255,255,255,.88);border:1px solid #fff;
  border-radius:38px;padding:32px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden
}
.open-card:after{
  content:"";position:absolute;inset:auto -20% 0;height:120px;
  background:#ffe3ed;transform:rotate(-3deg);z-index:-1
}
.open-photo{
  width:min(340px,80vw);height:min(340px,80vw);object-fit:cover;border-radius:28px;
  padding:9px;background:#fff;box-shadow:0 18px 45px rgba(111,51,73,.18);
  transform:rotate(-2deg);margin:4px auto 20px
}
.open-card h2{font:600 clamp(40px,6vw,63px)/1.05 "Playfair Display",serif;color:var(--wine);margin:5px 0}
.open-card .script{font:600 30px Caveat,cursive;color:var(--deep)}
.open-card .copy{max-width:730px;margin:12px auto 20px;color:var(--muted);line-height:1.85}
.envelope{width:280px;height:175px;margin:25px auto 10px;position:relative;cursor:pointer;filter:drop-shadow(0 18px 30px rgba(91,39,59,.18))}
.env-body{position:absolute;inset:0;border-radius:10px;background:#f4b7cb}
.flap{position:absolute;left:0;top:0;width:0;height:0;z-index:4;border-left:140px solid transparent;border-right:140px solid transparent;border-top:100px solid #ffd0df;transform-origin:top;transition:.8s}
.envelope.open .flap{transform:rotateX(180deg)}
.seal{position:absolute;z-index:5;left:50%;top:51%;transform:translate(-50%,-50%);font-size:42px}
.open-note{font:600 23px Caveat,cursive;color:var(--deep)}

/* NAV */
header{position:sticky;top:0;z-index:700;background:rgba(255,249,252,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(162,77,108,.12)}
.nav{max-width:1180px;margin:auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{font:600 26px "Playfair Display",serif;color:var(--wine)}
.links{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.links button{border:0;background:transparent;color:#765b66;padding:8px 11px;border-radius:999px}
.links button:hover{background:#ffe7ef;color:var(--wine)}

/* HERO */
.hero{min-height:88vh;display:grid;place-items:center;padding-top:60px}
.hero-box{
  width:min(1000px,100%);padding:52px 35px;text-align:center;border-radius:38px;
  background:rgba(255,255,255,.77);border:1px solid #fff;box-shadow:var(--shadow);position:relative;overflow:hidden
}
.hero-box:before{content:"🎀";position:absolute;right:35px;top:20px;font-size:40px;transform:rotate(8deg)}
.hero-photo{
  width:255px;height:255px;object-fit:cover;border-radius:50%;padding:8px;background:#fff;
  box-shadow:0 18px 42px rgba(105,49,70,.18)
}
.hero h1{font:600 clamp(56px,9vw,98px)/.94 "Playfair Display",serif;color:var(--wine);margin:18px 0 13px}
.hero .lead{max-width:790px;margin:auto;color:var(--muted);font-size:16px;line-height:1.95}
.pill{display:inline-block;margin-top:24px;background:#fff;padding:11px 20px;border-radius:999px;color:var(--wine);font-weight:800}

/* PAPER */
.paper{
  max-width:850px;margin:auto;background:#fffdf9;padding:50px 58px;border-radius:14px;
  box-shadow:var(--shadow);border:1px solid #f3e2e7;position:relative
}
.paper:before,.paper:after{content:"";position:absolute;width:105px;height:28px;background:#f6c3d2;opacity:.68}
.paper:before{top:-12px;left:35px;transform:rotate(-5deg)}
.paper:after{bottom:-10px;right:45px;transform:rotate(4deg)}
.paper h3{font:500 34px "Playfair Display",serif;color:var(--wine);margin:0 0 18px}
.paper p{white-space:pre-line;line-height:2;color:#5b474f;margin:0}
.signature{font:600 27px Caveat,cursive;color:var(--deep);margin-top:20px}

/* TIMELINE */
.timeline{max-width:960px;margin:auto;position:relative}
.timeline:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#efc5d3}
.titem{position:relative;width:50%;padding:20px 40px}
.titem:nth-child(even){margin-left:50%}
.dot{position:absolute;right:-10px;top:31px;width:20px;height:20px;border-radius:50%;background:var(--rose);border:5px solid #fff;box-shadow:0 0 0 2px #efc5d3}
.titem:nth-child(even) .dot{left:-10px;right:auto}
.tcard{background:#fff;padding:26px;border-radius:23px;box-shadow:var(--shadow);border:1px solid #f2dfe6;position:relative}
.tcard:after{content:"♡";position:absolute;right:18px;top:8px;color:#efb1c5;font-size:23px}
.tcard small{color:var(--deep);font-weight:800;letter-spacing:1.5px}
.tcard h3{font:500 29px "Playfair Display",serif;color:var(--wine);margin:8px 0}
.tcard p{line-height:1.75;color:var(--muted);margin:0}

/* DIANE SECTION */
.diane{
  background:
    linear-gradient(transparent 31px,#f6e2e7 32px),
    #fffdfb;
  background-size:100% 32px;
  padding:48px 50px 42px;border-radius:30px;box-shadow:var(--shadow);
  border:1px solid #f3dbe3;position:relative
}
.diane h3{font:600 36px "Playfair Display",serif;color:var(--wine);margin:0 0 9px}
.diane .leadline{font:600 29px Caveat,cursive;color:var(--deep);margin:0 0 22px}
.diane p{font-size:16px;line-height:2;color:#5b474f;margin:0 0 18px}
.highlight{background:#ffe0ea;padding:2px 7px;border-radius:8px;color:#87435e;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
.chip{background:#fff;border:1px solid #efc9d6;padding:10px 14px;border-radius:999px;color:#7b4a5e;box-shadow:0 5px 15px rgba(99,48,66,.05)}
.kitty-stage{
  margin-top:30px;border-radius:28px;background:linear-gradient(135deg,#fff,#ffe9f1);
  border:1px solid #f1cbd8;padding:24px;display:grid;grid-template-columns:230px 1fr;gap:25px;align-items:center
}
.kitty-gif{width:210px;height:210px;object-fit:cover;border-radius:24px;background:#fff;box-shadow:0 12px 30px rgba(106,50,72,.12)}
.kitty-stage h4{font:500 31px "Playfair Display",serif;color:var(--wine);margin:0 0 8px}
.kitty-stage p{margin:0}

/* GIF WALL */
.gif-wall{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.gif-card{background:#fff;padding:13px;border-radius:25px;box-shadow:var(--shadow);border:1px solid #f1dfe5;position:relative;overflow:hidden}
.gif-card:before{content:"🎀";position:absolute;right:14px;top:10px;z-index:2;font-size:25px}
.gif-card img{width:100%;height:245px;object-fit:cover;border-radius:17px;display:block;background:#ffe8f0}
.gif-card h3{font:500 25px "Playfair Display",serif;color:var(--wine);margin:15px 5px 4px}
.gif-card p{color:var(--muted);line-height:1.6;margin:0 5px 8px}

/* LETTERS */
.letters{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.letter{background:#fff;padding:30px 23px;border-radius:27px;text-align:center;box-shadow:var(--shadow);border:1px solid #f1dfe5;min-height:270px;position:relative;overflow:hidden}
.letter:before{content:"";position:absolute;left:-20%;right:-20%;top:-35px;height:120px;background:#ffdce8;transform:rotate(-6deg)}
.letter .icon{position:relative;font-size:43px;margin:16px 0 9px}
.letter h3{position:relative;font:500 29px "Playfair Display",serif;color:var(--wine);margin:0 0 8px}
.letter p{position:relative;color:var(--muted);line-height:1.65}
.btn{position:relative;border:0;border-radius:999px;padding:11px 18px;background:var(--deep);color:#fff;font-weight:800}

/* DAYS */
.day-card{max-width:920px;margin:auto;background:rgba(255,255,255,.94);border:1px solid #f1dfe5;padding:45px;border-radius:30px;box-shadow:var(--shadow)}
.lock{max-width:920px;margin:auto;padding:70px 25px;text-align:center;background:rgba(255,255,255,.8);border-radius:30px;box-shadow:var(--shadow)}
.lock .big{font-size:56px}
.lock h3{font:500 36px "Playfair Display",serif;color:var(--wine);margin:10px 0}
.lock p{color:var(--muted);line-height:1.7}
.timer{margin-top:13px;font-weight:800;color:var(--deep);font-size:18px}
.day-label{text-transform:uppercase;letter-spacing:4px;color:var(--deep);font-size:11px;font-weight:800}
.day-card h2{font:600 clamp(42px,7vw,70px)/1 "Playfair Display",serif;color:var(--wine);margin:10px 0 28px}
.schedule{display:grid;gap:13px;margin-top:28px}
.event{display:flex;gap:20px;padding:18px;border-radius:19px;background:#fff7fa;border:1px solid #f1d8e0}
.time{min-width:95px;color:var(--deep);font-weight:800}
.event strong{color:#674550}.event p{margin:4px 0;color:var(--muted);line-height:1.55}

/* MUSIC */
.music{position:fixed;left:16px;bottom:16px;z-index:800;display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;background:rgba(255,255,255,.95);border-radius:999px;box-shadow:0 13px 40px rgba(66,28,44,.16)}
.music button{width:43px;height:43px;border:0;border-radius:50%;background:var(--deep);color:#fff}
.music strong{display:block;color:var(--wine);font-size:12px}.music span{font-size:11px;color:var(--muted)}

/* MODAL */
#modal{position:fixed;inset:0;z-index:3000;display:none;place-items:center;padding:20px;background:rgba(54,25,37,.45);backdrop-filter:blur(8px)}
.modal-card{width:min(780px,100%);max-height:85vh;overflow:auto;background:#fffdf9;border-radius:30px;padding:42px;box-shadow:0 30px 100px rgba(40,15,25,.3);position:relative}
.close{position:absolute;right:15px;top:12px;border:0;background:#fff0f5;color:var(--wine);width:36px;height:36px;border-radius:50%;font-size:22px}
.modal-card h2{font:500 38px "Playfair Display",serif;color:var(--wine);margin-top:0}
.modal-card p{white-space:pre-line;line-height:1.9;color:#5b474f}

footer{text-align:center;padding:80px 20px 120px;color:#85636d;position:relative;z-index:3}
footer strong{color:var(--wine)}

@media(max-width:850px){
  .nav{flex-direction:column}
  .links{justify-content:center}
  .hero-box{padding:42px 20px}
  .hero-photo{width:195px;height:195px}
  .paper{padding:38px 25px}
  .timeline:before{left:8px}
  .titem,.titem:nth-child(even){width:100%;margin-left:0;padding-left:34px;padding-right:0}
  .dot,.titem:nth-child(even) .dot{left:0;right:auto}
  .gif-wall,.letters{grid-template-columns:1fr}
  .kitty-stage{grid-template-columns:1fr;text-align:center}
  .kitty-gif{margin:auto}
  .day-card{padding:28px 20px}
  .event{flex-direction:column;gap:5px}
  .music{left:7px;bottom:7px}
  .diane{padding:38px 25px}
}
</style>
</head>
